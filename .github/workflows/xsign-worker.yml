name: XSign macOS Signing Worker

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'xsign_worker.py'
      - 'requirements-xsign.txt'
      - '.github/workflows/xsign-worker.yml'

concurrency:
  group: xsign-signing-worker
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  sign:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      XSIGN_BASE_URL: https://api-v2.appdeploy.ai/app/xsign-0xcfp9
      APPLE_BUNDLE_PREFIX: com.moha700m.xsign

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install worker dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-xsign.txt

      - name: Keep XSign worker warm
        shell: bash
        run: |
          started=$SECONDS
          while (( SECONDS - started < 240 )); do
            echo "Polling XSign signing queue..."
            python xsign_worker.py --max-jobs 10
            remaining=$((240 - (SECONDS - started)))
            if (( remaining <= 0 )); then
              break
            fi
            sleep_for=10
            if (( remaining < sleep_for )); then
              sleep_for=$remaining
            fi
            sleep "$sleep_for"
          done
