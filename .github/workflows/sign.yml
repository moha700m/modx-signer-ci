name: MOD X Signer

# Direct job runner for the SignTools-style signing API. This workflow signs a
# single IPA when given a job id, API base, and one-time worker token. It is
# kept as a manual fallback and for integration with the MOD X service; it does
# NOT poll the XSign queue and therefore cannot process the current XMOD
# customer orders. Those orders are served exclusively by xsign-worker.yml.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Signing job ID
        required: true
        type: string
      api_base:
        description: MOD X Signer API base URL
        required: true
        type: string
      worker_token:
        description: One-time worker token
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: modx-signer-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  sign:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      JOB_ID: ${{ inputs.job_id }}
      API_BASE: ${{ inputs.api_base }}
      WORKER_TOKEN: ${{ inputs.worker_token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "$JOB_ID"
          test -n "$API_BASE"
          test -n "$WORKER_TOKEN"

      - name: Sign IPA
        shell: bash
        run: |
          set -euo pipefail
          PYTHONUNBUFFERED=1 python3 worker.py
