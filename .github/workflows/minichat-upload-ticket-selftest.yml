name: Minichat Upload Ticket Selftest
on:
  workflow_dispatch:
  push:
    branches: [minichat-fast-install]
    paths:
      - '.github/workflows/minichat-upload-ticket-selftest.yml'
jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Verify signed upload ticket
        run: |
          set -euo pipefail
          BODY="$(curl -fsS 'https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-upload-ticket/selftest')"
          echo "$BODY"
          python - "$BODY" <<'PY'
          import json,sys
          d=json.loads(sys.argv[1])
          assert d.get('ok') is True, d
          assert d.get('stage') == 'standard', d
          assert d.get('standardOk') is True, d
          assert d.get('dots') == 2, d
          print('signed upload ticket selftest passed')
          PY
