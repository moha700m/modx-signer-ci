<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a11"><title>تثبيت Minichat</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#fff;background:#070a11}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#2a3470 0,#0b101a 42%,#05070b 80%)}main{width:min(100%,560px);margin:auto;padding:24px 14px 54px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-weight:900}.pill{font-size:11px;color:#aab4c8;padding:7px 10px;border:1px solid #283149;background:#101520;border-radius:999px}.card{background:rgba(14,18,27,.96);border:1px solid #263047;border-radius:29px;padding:27px 20px;box-shadow:0 28px 90px rgba(0,0,0,.5)}.icon{width:92px;height:92px;margin:2px auto 18px;border-radius:25px;display:grid;place-items:center;font-size:42px;font-weight:950;background:linear-gradient(145deg,#5e70ff,#3e53cf)}h1{text-align:center;font-size:31px;margin:0 0 7px}.lead{text-align:center;color:#a7b0c2;line-height:1.75;margin:0 auto 19px}.status{padding:14px;border-radius:16px;background:#0d121b;border:1px solid #222c40;color:#aeb7c8;line-height:1.7;font-size:13px;margin:14px 0}.status.ok{background:#0b1e14;border-color:#26563a;color:#b6efc9}.status.bad{background:#241014;border-color:#54242c;color:#ffc0c6}.btn{display:block;width:100%;border:0;border-radius:17px;padding:16px 18px;text-align:center;text-decoration:none;font:inherit;font-weight:900;color:#fff;background:linear-gradient(135deg,#6676ff,#4f62df);cursor:pointer}.btn.secondary{margin-top:10px;background:#151c28;border:1px solid #2d3950}.btn:disabled{opacity:.5}.footer{text-align:center;font-size:11px;color:#687286;line-height:1.7;margin-top:18px}.spinner{width:18px;height:18px;border:2px solid #ffffff45;border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-4px;margin-left:7px;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><main><div class="top"><div class="brand">Minichat</div><div class="pill" id="service">فحص الخدمة…</div></div><section class="card"><div class="icon">M</div><h1>تثبيت Minichat</h1><p class="lead">تسجيل الجهاز، توقيع النسخة، ثم التثبيت من Safari.</p><div id="status" class="status">جاري التحقق…</div><div id="actions"></div></section><div class="footer">نسخة إصلاح تسجيل UDID — افتحها في Safari.</div></main><script>const API='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-fast-api';const PROFILE='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-device-profile';const $=s=>document.querySelector(s),status=$('#status'),actions=$('#actions'),service=$('#service');let session=new URLSearchParams(location.search).get('session')||localStorage.getItem('minichat-fast-session')||'';function setStatus(t,c=''){status.className='status '+c;status.innerHTML=t}function button(label,fn,cls=''){actions.innerHTML=`<button id="mainbtn" class="btn ${cls}">${label}</button>`;$('#mainbtn').onclick=fn}function link(label,href){actions.innerHTML=`<a class="btn" href="${href}">${label}</a>`}async function post(action,data={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...data})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'تعذر إكمال العملية');return d}async function health(){try{const r=await fetch(API+'/health',{cache:'no-store'}),h=await r.json();service.textContent=h.sourceReady?'الخدمة جاهزة':'بانتظار النسخة';service.style.color=h.sourceReady?'#b6efc9':'#ffd79b';return h}catch(e){service.textContent='غير متصل';setStatus(e.message,'bad');return null}}function profileUrl(){return `${PROFILE}/profile?id=${encodeURIComponent(session)}`}async function start(){try{const s=await post('session.create');session=s.id;localStorage.setItem('minichat-fast-session',session);location.href=profileUrl()}catch(e){setStatus(e.message,'bad')}}async function sign(){const b=$('#mainbtn');if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span> جاري التوقيع…'}setStatus('يتم تسجيل الجهاز لدى Apple ثم توقيع Minichat.');try{const d=await post('sign',{id:session});setStatus('تم توقيع Minichat لهذا الجهاز.','ok');link('تثبيت Minichat الآن',d.otaUrl)}catch(e){setStatus(e.message,'bad');button('إعادة المحاولة',sign,'secondary')}}async function render(){const h=await health();if(!session){setStatus(h?.sourceReady?'جاهز. ابدأ بتسجيل هذا الآيفون.':'يمكن تسجيل الجهاز الآن، لكن يجب رفع نسخة Minichat الأساسية قبل التوقيع.');button('تسجيل هذا الآيفون',start);return}try{const s=await post('session.get',{id:session});if(s.status==='pending'){setStatus('ثبّت ملف تسجيل الجهاز، ثم سيعود النظام تلقائيًا.');button('تنزيل ملف التسجيل المصحح',()=>location.href=profileUrl())}else if(s.status==='device_ready'){setStatus(`تم تسجيل الجهاز${s.device_name?' — '+s.device_name:''}.`,'ok');button('توقيع وتثبيت Minichat',sign)}else if(s.status==='signing'){setStatus('<span class="spinner"></span> جاري التوقيع…');actions.innerHTML='';setTimeout(render,3500)}else if(s.status==='ready'&&s.release_id){const manifest=`https://flarestore.app/i/${encodeURIComponent(s.release_id)}/manifest.plist`;setStatus('نسختك جاهزة.','ok');link('تثبيت Minichat الآن',`itms-services://?action=download-manifest&url=${encodeURIComponent(manifest)}`)}else if(s.status==='failed'){setStatus(s.error||'تعذر التوقيع.','bad');button('إعادة المحاولة',sign,'secondary')}}catch(e){localStorage.removeItem('minichat-fast-session');session='';setStatus('انتهت الجلسة. ابدأ من جديد.');button('بدء تسجيل الجهاز',start)}}render();</script></body></html>
