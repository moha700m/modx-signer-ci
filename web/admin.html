<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080a10"><title>إعداد Minichat</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#fff;background:#080a10}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -15%,#29346d 0,#0c1019 44%,#05070a 82%)}main{min-height:100vh;display:grid;place-items:center;padding:20px 13px}.panel{width:min(100%,610px);padding:27px 20px;border-radius:28px;background:#0f131c;border:1px solid #263047;box-shadow:0 28px 80px #0008}h1{margin:0 0 8px}.lead{color:#9da8ba;line-height:1.7;margin:0 0 18px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:#abb4c4}.field input{width:100%;border:1px solid #2c3548;border-radius:14px;background:#090c12;color:#fff;padding:13px;font:inherit}.file{padding:15px;border-radius:16px;border:1px dashed #3a455e;background:#0a0e15}.file small{display:block;color:#8994a7;margin:5px 0 10px}.btn{width:100%;border:0;border-radius:16px;padding:15px 18px;background:linear-gradient(135deg,#6676ff,#4f62df);color:#fff;font:inherit;font-weight:900;margin-top:14px}.btn:disabled{opacity:.45}.progress{height:9px;background:#171d29;border-radius:999px;overflow:hidden;margin-top:17px}.bar{height:100%;width:0;background:linear-gradient(90deg,#6676ff,#42d28b);transition:width .25s}.bar.busy{animation:p 1.1s ease-in-out infinite alternate}@keyframes p{from{width:18%}to{width:82%}}.status{margin-top:15px;padding:13px;border-radius:15px;background:#0c1119;border:1px solid #242e41;color:#aeb8c9;line-height:1.7;font-size:13px}.ok{background:#0b2015;border-color:#285c3d;color:#b9f2cc}.bad{background:#271115;border-color:#59272d;color:#ffc0c6}.hint{font-size:11px;color:#727c8d;line-height:1.7;margin-top:16px}</style></head><body><main><section class="panel"><h1>رفع نسخة Minichat الأساسية</h1><p class="lead">مرة واحدة فقط. بعدها العميل لا يرفع أي ملف؛ يسجل جهازه ويضغط تثبيت.</p><div class="field"><label>كود الإدارة المؤقت</label><input id="code" autocomplete="off" autocapitalize="characters" placeholder="MGZ-...."></div><div class="file"><strong>Minichat Fast IPA</strong><small>اختر Minichat_MGZ_FAST_NO_PUSH.ipa</small><input id="file" type="file" accept=".ipa,application/octet-stream"></div><div class="progress"><div id="bar" class="bar"></div></div><button id="upload" class="btn">رفع النسخة وتجهيز الموقع</button><div id="status" class="status">بانتظار الملف.</div><div class="hint">الرفع يتم بتوكن Supabase موقّع لمرة واحدة. كود الإدارة يتوقف بعد نجاح الرفع.</div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const PROJECT='https://gbvopmtmzosqknntaafl.supabase.co',PUB='sb_publishable_JrKtx_1NWA9-vgeRE-9TcQ_QQ5XJ-LM',API=PROJECT+'/functions/v1/minichat-fast-api',TICKET=PROJECT+'/functions/v1/minichat-upload-ticket',sb=createClient(PROJECT,PUB,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),$=s=>document.querySelector(s),code=$('#code'),file=$('#file'),btn=$('#upload'),bar=$('#bar'),status=$('#status');function msg(t,c=''){status.className='status '+c;status.textContent=t}async function post(action,data={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...data})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'فشل الطلب');return d}async function ticket(c){const r=await fetch(TICKET,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:c})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'تعذر تجهيز توكن الرفع');if(!d.token||!d.bucket||!d.path)throw new Error('استجابة رفع غير مكتملة');return d}async function check(){try{const d=await post('source.status');if(d.ready){msg('✓ النسخة الأساسية موجودة والموقع جاهز للعمل.','ok');btn.disabled=true}}catch(e){msg('تعذر فحص حالة التخزين: '+e.message,'bad')}}check();btn.onclick=async()=>{const c=code.value.trim().toUpperCase(),f=file.files[0];if(!c)return msg('أدخل كود الإدارة.','bad');if(!f)return msg('اختر ملف Minichat_MGZ_FAST_NO_PUSH.ipa.','bad');if(f.size>200*1024*1024)return msg('الملف أكبر من 200MB.','bad');btn.disabled=true;bar.className='bar busy';try{msg('جاري تجهيز توكن الرفع الموقّع…');const d=await ticket(c);msg('جاري رفع Minichat… لا تغلق Safari حتى يكتمل.');const{error}=await sb.storage.from(d.bucket).uploadToSignedUrl(d.path,d.token,f,{contentType:'application/octet-stream',cacheControl:'60',upsert:true});if(error)throw error;bar.className='bar';bar.style.width='92%';msg('تم رفع الملف. جاري تفعيل النسخة…');await post('admin.complete',{code:c});bar.style.width='100%';msg('✓ تم تجهيز Minichat. صفحة العملاء جاهزة الآن.','ok')}catch(e){bar.className='bar';bar.style.width='0';msg((e&&e.message)||String(e),'bad');btn.disabled=false}};</script></body></html>
