<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MGZ Store"><meta name="theme-color" content="#070a11"><title>MGZ Store</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#fff;background:#070a11}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#2d3979 0,#0d121d 42%,#05070b 82%)}main{width:min(100%,620px);margin:auto;padding:22px 14px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand{font-size:22px;font-weight:950}.badge{font-size:11px;padding:7px 10px;border:1px solid #2c3650;border-radius:999px;background:#101621;color:#aeb8ca}.hero{padding:22px;border:1px solid #263149;border-radius:28px;background:#0e131d;box-shadow:0 24px 70px #0008}.hero h1{font-size:29px;margin:0 0 6px}.hero p{margin:0;color:#9ca8bb;line-height:1.7}.sub{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.sub div{padding:11px;border:1px solid #273249;border-radius:14px;background:#0a0f17}.sub b,.sub small{display:block}.sub small{color:#7f899b;margin-top:4px}.apps{margin-top:18px}.section-title{font-weight:900;margin:0 0 10px}.app{display:flex;gap:14px;align-items:center;padding:16px;border:1px solid #273149;border-radius:22px;background:#0e131d}.icon{width:72px;height:72px;border-radius:20px;display:grid;place-items:center;font-size:31px;font-weight:950;background:linear-gradient(145deg,#6676ff,#4659d8);flex:0 0 auto}.info{flex:1;min-width:0}.info h2{font-size:19px;margin:0 0 4px}.info p{font-size:12px;color:#8f9aac;margin:0}.btn{border:0;border-radius:15px;padding:12px 16px;background:linear-gradient(135deg,#6676ff,#4f62df);color:#fff;font:inherit;font-weight:900;white-space:nowrap}.btn:disabled{opacity:.5}.status{margin-top:12px;padding:13px;border-radius:15px;background:#0d121b;border:1px solid #222c40;color:#aeb7c8;line-height:1.7;font-size:13px}.status.ok{background:#0b1e14;border-color:#26563a;color:#b6efc9}.status.wait{background:#221b0c;border-color:#5b471e;color:#ffe0a0}.status.bad{background:#241014;border-color:#54242c;color:#ffc0c6}.login{margin-top:12px}.input{width:100%;border:1px solid #2c3850;border-radius:15px;background:#090d14;color:#fff;padding:14px;font:inherit;text-align:center;text-transform:uppercase}.footer{text-align:center;font-size:11px;color:#677286;line-height:1.7;margin-top:18px}@media(max-width:430px){.app{align-items:flex-start}.btn{padding:11px 13px}.sub{grid-template-columns:1fr}}</style></head><body><main><div class="top"><div class="brand">MGZ Store</div><div class="badge" id="svc">جاري التحقق…</div></div><section class="hero"><h1>متجر MGZ</h1><p>تطبيقاتك المخصصة لهذا الآيفون. الاشتراك والجهاز يتم التحقق منهما قبل أي تثبيت.</p><div id="sub" class="sub"></div><div id="global" class="status">جاري تجهيز المتجر…</div><div id="login"></div></section><section class="apps" id="apps" hidden><div class="section-title">التطبيقات</div><div class="app"><div class="icon">M</div><div class="info"><h2>Minichat</h2><p>نسخة MGZ الخاصة · v5.379</p></div><button id="install" class="btn">تثبيت</button></div><div id="appstatus" class="status">جاهز للتثبيت.</div></section><div class="footer">إذا كان جهازك جديدًا لدى Apple، المتجر يعيد المحاولة تلقائيًا حتى يصبح التوقيع متاحًا.</div></main><script>const API='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-subscriptions-api';const FAST='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-fast-api';const $=s=>document.querySelector(s),global=$('#global'),sub=$('#sub'),apps=$('#apps'),appstatus=$('#appstatus'),install=$('#install'),login=$('#login'),svc=$('#svc');let session=new URLSearchParams(location.search).get('session')||localStorage.getItem('mgz-store-session')||localStorage.getItem('minichat-fast-session')||'',code=localStorage.getItem('minichat-sub-code')||'',timer=null;function msg(el,t,c=''){el.className='status '+c;el.textContent=t}async function post(action,data={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...data})});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'تعذر إكمال العملية');e.code=d.code||'';e.status=r.status;throw e}return d}function fmt(d){return new Date(d).toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'})}function showSub(s){sub.innerHTML=`<div><b>${s.name||'-'}</b><small>العميل</small></div><div><b>${fmt(s.expiresAt)}</b><small>ينتهي الاشتراك</small></div>`}function loginView(text='أدخل كود اشتراكك مرة واحدة.'){msg(global,text);login.innerHTML='<div class="login"><input id="code" class="input" placeholder="MGZ-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters"><button id="go" class="btn" style="width:100%;margin-top:9px">دخول</button></div>';$('#go').onclick=async()=>{const v=$('#code').value.trim().toUpperCase();if(!v)return;try{const s=await post('customer.verify',{code:v});code=v;localStorage.setItem('minichat-sub-code',v);showSub(s);login.innerHTML='';boot()}catch(e){msg(global,e.message,'bad')}}}async function getState(){return post('customer.session.get',{code,id:session})}function otaFrom(d){if(d&&typeof d.otaUrl==='string'&&d.otaUrl.startsWith('itms-services://'))return d.otaUrl;if(d&&d.releaseId){const m=`https://flarestore.app/i/${encodeURIComponent(d.releaseId)}/manifest.plist`;return `itms-services://?action=download-manifest&url=${encodeURIComponent(m)}`}return ''}function setInstallReady(ota){install.disabled=false;install.textContent='تثبيت الآن';install.onclick=()=>{if(!ota||!ota.startsWith('itms-services://')){msg(appstatus,'رابط التثبيت غير جاهز. اضغط إعادة المحاولة.','bad');return}location.href=ota};msg(appstatus,'تم التوقيع. اضغط «تثبيت الآن» لبدء تثبيت Minichat.','ok')}async function boot(){try{const h=await fetch(FAST+'/health',{cache:'no-store'}).then(r=>r.json());svc.textContent=h.sourceReady?'الخدمة جاهزة':'صيانة'}catch{svc.textContent='غير متصل'}if(!session){apps.hidden=true;return msg(global,'هذا المتجر غير مربوط بجهاز. ثبته من رابط MGZ الرئيسي.','bad')}localStorage.setItem('mgz-store-session',session);if(!code)return loginView();try{const s=await post('customer.verify',{code});showSub(s);const st=await getState();apps.hidden=false;login.innerHTML='';if(st.status==='ready'&&st.release_id){const m=`https://flarestore.app/i/${encodeURIComponent(st.release_id)}/manifest.plist`;msg(global,'المتجر جاهز.','ok');setInstallReady(`itms-services://?action=download-manifest&url=${encodeURIComponent(m)}`);return}if(st.status==='device_processing'){msg(global,'جهازك مسجل وجاري تفعيله لدى Apple.','wait');msg(appstatus,'سنعاود المحاولة تلقائيًا كل 30 ثانية.','wait');install.disabled=true;install.textContent='بانتظار Apple…';timer=setTimeout(signNow,30000);return}msg(global,'المتجر جاهز لهذا الجهاز.','ok');install.disabled=false;install.textContent='توقيع وتثبيت';install.onclick=signNow}catch(e){if(e.code==='INVALID_CODE'){code='';localStorage.removeItem('minichat-sub-code');return loginView('كود الاشتراك غير صحيح.')}msg(global,e.message,'bad')}}async function signNow(){if(timer){clearTimeout(timer);timer=null}install.disabled=true;install.textContent='جاري التجهيز…';msg(appstatus,'يتم تجهيز Minichat لهذا الآيفون.');try{const d=await post('customer.sign',{code,id:session});if(d.status==='device_processing'||d.code==='DEVICE_PROCESSING'||!otaFrom(d)){msg(appstatus,d.message||'تم تسجيل جهازك لدى Apple وجاري تفعيله. سنعيد المحاولة تلقائيًا كل 30 ثانية.','wait');install.disabled=true;install.textContent='بانتظار Apple…';timer=setTimeout(signNow,30000);return}const ota=otaFrom(d);setInstallReady(ota)}catch(e){const waiting=/PROCESSING|processing|device status|تفعيل الجهاز/i.test(e.message)||e.code==='DEVICE_PROCESSING';if(waiting){msg(appstatus,'تم تسجيل جهازك لدى Apple وجاري تفعيله. سنعيد المحاولة تلقائيًا كل 30 ثانية.','wait');install.disabled=true;install.textContent='بانتظار Apple…';timer=setTimeout(signNow,30000);return}msg(appstatus,e.message,'bad');install.disabled=false;install.textContent='إعادة المحاولة';install.onclick=signNow}}boot();</script></body></html>
