<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a11"><title>Minichat</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#fff;background:#070a11}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#29366f 0,#0b101a 42%,#05070b 80%)}main{width:min(100%,560px);margin:auto;padding:20px 12px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900}.pill{font-size:11px;color:#aeb7c8;padding:7px 10px;border:1px solid #293349;background:#111722;border-radius:999px}.card{background:rgba(14,18,27,.97);border:1px solid #263047;border-radius:28px;padding:25px 18px;box-shadow:0 28px 80px #0008}.icon{width:86px;height:86px;margin:0 auto 17px;border-radius:24px;display:grid;place-items:center;font-size:40px;font-weight:950;background:linear-gradient(145deg,#6676ff,#4659d8)}h1{text-align:center;margin:0;font-size:30px}.lead{text-align:center;color:#9fa9ba;line-height:1.7;margin:8px 0 18px}.sub{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.sub div{padding:10px 8px;border:1px solid #283249;border-radius:13px;background:#0d121b;text-align:center}.sub b,.sub small{display:block}.sub b{font-size:13px}.sub small{font-size:10px;color:#7f899b;margin-top:4px}.status{padding:14px;border-radius:16px;background:#0d121b;border:1px solid #222c40;color:#aeb7c8;line-height:1.7;font-size:13px;margin:14px 0}.status.ok{background:#0b1e14;border-color:#26563a;color:#b6efc9}.status.bad{background:#241014;border-color:#54242c;color:#ffc0c6}.input{width:100%;border:1px solid #2c3850;border-radius:15px;background:#090d14;color:#fff;padding:15px;font:inherit;text-align:center;letter-spacing:.04em;text-transform:uppercase}.btn{display:block;width:100%;border:0;border-radius:17px;padding:16px 18px;text-align:center;text-decoration:none;font:inherit;font-weight:900;color:#fff;background:linear-gradient(135deg,#6676ff,#4f62df);cursor:pointer}.btn.secondary{margin-top:9px;background:#151c28;border:1px solid #2d3950}.btn.ghost{margin-top:9px;background:transparent;border:1px solid #2a3347;color:#9ea8b9}.btn:disabled{opacity:.48}.spinner{width:18px;height:18px;border:2px solid #ffffff45;border-top-color:#fff;border-radius:50%;display:inline-block;vertical-align:-4px;margin-left:7px;animation:s .7s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.footer{text-align:center;font-size:11px;color:#687286;line-height:1.7;margin-top:16px}@media(max-width:430px){.sub{grid-template-columns:1fr 1fr}.sub div:last-child{grid-column:1/-1}}</style></head><body><main><div class="top"><div class="brand">Minichat</div><div class="pill" id="service">الخدمة</div></div><section class="card"><div class="icon">M</div><h1>تثبيت Minichat</h1><p class="lead">الدخول بكود الاشتراك، تسجيل جهازك، ثم التوقيع والتثبيت مباشرة.</p><div id="subinfo"></div><div id="status" class="status">جاري التحقق…</div><div id="actions"></div></section><div class="footer">الاشتراك مربوط بعدد الأجهزة المسموح بها. افتح الصفحة في Safari.</div></main><script>const API='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-subscriptions-api',PROFILE='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-device-profile',FAST='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-fast-api';const $=s=>document.querySelector(s),status=$('#status'),actions=$('#actions'),subinfo=$('#subinfo'),service=$('#service');let code=localStorage.getItem('minichat-sub-code')||'',session=new URLSearchParams(location.search).get('session')||localStorage.getItem('minichat-fast-session')||'';function msg(t,c=''){status.className='status '+c;status.innerHTML=t}function btn(label,fn,cls=''){actions.innerHTML=`<button id="mainbtn" class="btn ${cls}">${label}</button>`;$('#mainbtn').onclick=fn}function link(label,href){actions.innerHTML=`<a class="btn" href="${href}">${label}</a>`}async function post(action,data={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...data})});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'تعذر إكمال العملية');e.code=d.code||'';throw e}return d}function fmt(d){return new Date(d).toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'})}function showSub(s){subinfo.innerHTML=`<div class="sub"><div><b>${s.name||'-'}</b><small>العميل</small></div><div><b>${fmt(s.expiresAt)}</b><small>ينتهي</small></div><div><b>${s.activeDevices}/${s.maxDevices}</b><small>الأجهزة</small></div></div>`}function logout(){localStorage.removeItem('minichat-sub-code');localStorage.removeItem('minichat-fast-session');code='';session='';subinfo.innerHTML='';render()}function loginView(err=''){msg(err||'أدخل كود الاشتراك الذي استلمته.');actions.innerHTML='<input id="subcode" class="input" placeholder="MGZ-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters"><button id="login" class="btn" style="margin-top:10px">دخول</button>';$('#login').onclick=async()=>{const v=$('#subcode').value.trim().toUpperCase();if(!v)return msg('أدخل كود الاشتراك.','bad');try{const s=await post('customer.verify',{code:v});code=v;localStorage.setItem('minichat-sub-code',v);showSub(s);session='';localStorage.removeItem('minichat-fast-session');render()}catch(e){msg(e.message,'bad')}}}async function start(){try{const s=await post('customer.session.create',{code});session=s.id;localStorage.setItem('minichat-fast-session',session);location.href=`${PROFILE}/profile?id=${encodeURIComponent(session)}`}catch(e){msg(e.message,'bad')}}async function sign(){const b=$('#mainbtn');if(b){b.disabled=true;b.innerHTML='<span class="spinner"></span> جاري التوقيع…'}msg('يتم تجهيز النسخة لهذا الجهاز. لا تقفل الصفحة.');try{const d=await post('customer.sign',{code,id:session});msg('تم توقيع Minichat لهذا الجهاز.','ok');link('تثبيت Minichat الآن',d.otaUrl)}catch(e){msg(e.message,'bad');btn('إعادة المحاولة',sign,'secondary')}}async function render(){try{const h=await fetch(FAST+'/health',{cache:'no-store'}).then(r=>r.json());service.textContent=h.sourceReady?'جاهز':'صيانة';service.style.color=h.sourceReady?'#b6efc9':'#ffd79b'}catch{service.textContent='غير متصل'}if(!code)return loginView();let sub;try{sub=await post('customer.verify',{code});showSub(sub)}catch(e){code='';localStorage.removeItem('minichat-sub-code');return loginView(e.message)}if(!session){msg('اشتراكك فعال. سجّل هذا الآيفون للمتابعة.','ok');btn('تسجيل هذا الآيفون',start);actions.insertAdjacentHTML('beforeend','<button id="logout" class="btn ghost">تغيير كود الاشتراك</button>');$('#logout').onclick=logout;return}try{const s=await post('customer.session.get',{code,id:session});showSub(s.subscription);if(s.status==='pending'){msg('ثبّت ملف تسجيل الجهاز من الإعدادات ثم ارجع للموقع.');btn('تنزيل ملف تسجيل الجهاز مرة أخرى',()=>location.href=`${PROFILE}/profile?id=${encodeURIComponent(session)}`)}else if(s.status==='device_ready'){msg(`تم تسجيل الجهاز${s.device_name?' — '+s.device_name:''}.`,'ok');btn('توقيع وتثبيت Minichat',sign)}else if(s.status==='signing'){msg('<span class="spinner"></span> جاري التوقيع…');actions.innerHTML='';setTimeout(render,3500)}else if(s.status==='ready'&&s.release_id){const m=`https://flarestore.app/i/${encodeURIComponent(s.release_id)}/manifest.plist`;msg('نسختك جاهزة.','ok');link('تثبيت Minichat الآن',`itms-services://?action=download-manifest&url=${encodeURIComponent(m)}`)}else if(s.status==='failed'){msg(s.error||'تعذر التوقيع.','bad');btn('إعادة المحاولة',sign,'secondary')}}catch(e){localStorage.removeItem('minichat-fast-session');session='';msg(e.message,'bad');btn('بدء جلسة جديدة',start,'secondary')}}render();</script></body></html>
