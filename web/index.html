<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a11"><title>MGZ</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#fff;background:#070a11}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#29366f 0,#0b101a 42%,#05070b 80%)}main{width:min(100%,560px);margin:auto;padding:20px 12px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:950;font-size:20px}.pill{font-size:11px;color:#aeb7c8;padding:7px 10px;border:1px solid #293349;background:#111722;border-radius:999px}.card{background:rgba(14,18,27,.97);border:1px solid #263047;border-radius:28px;padding:25px 18px;box-shadow:0 28px 80px #0008}.icon{width:86px;height:86px;margin:0 auto 17px;border-radius:24px;display:grid;place-items:center;font-size:32px;font-weight:950;background:linear-gradient(145deg,#6676ff,#4659d8)}h1{text-align:center;margin:0;font-size:30px}.lead{text-align:center;color:#9fa9ba;line-height:1.7;margin:8px 0 18px}.sub{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.sub div{padding:10px 8px;border:1px solid #283249;border-radius:13px;background:#0d121b;text-align:center}.sub b,.sub small{display:block}.sub b{font-size:13px}.sub small{font-size:10px;color:#7f899b;margin-top:4px}.status{padding:14px;border-radius:16px;background:#0d121b;border:1px solid #222c40;color:#aeb7c8;line-height:1.7;font-size:13px;margin:14px 0}.status.ok{background:#0b1e14;border-color:#26563a;color:#b6efc9}.status.bad{background:#241014;border-color:#54242c;color:#ffc0c6}.input{width:100%;border:1px solid #2c3850;border-radius:15px;background:#090d14;color:#fff;padding:15px;font:inherit;text-align:center;letter-spacing:.04em;text-transform:uppercase}.btn{display:block;width:100%;border:0;border-radius:17px;padding:16px 18px;text-align:center;text-decoration:none;font:inherit;font-weight:900;color:#fff;background:linear-gradient(135deg,#6676ff,#4f62df);cursor:pointer}.btn.secondary{margin-top:9px;background:#151c28;border:1px solid #2d3950}.btn.ghost{margin-top:9px;background:transparent;border:1px solid #2a3347;color:#9ea8b9}.footer{text-align:center;font-size:11px;color:#687286;line-height:1.7;margin-top:16px}@media(max-width:430px){.sub{grid-template-columns:1fr 1fr}.sub div:last-child{grid-column:1/-1}}</style></head><body><main><div class="top"><div class="brand">MGZ</div><div class="pill" id="service">الخدمة</div></div><section class="card"><div class="icon">MGZ</div><h1>تجهيز MGZ Store</h1><p class="lead">فعّل اشتراكك، سجّل هذا الآيفون مرة واحدة، ثم ثبّت أيقونة MGZ Store على الشاشة الرئيسية.</p><div id="subinfo"></div><div id="status" class="status">جاري التحقق…</div><div id="actions"></div></section><div class="footer">بعد تثبيت MGZ Store، كل التطبيقات والتحديثات تكون من داخل المتجر.</div></main><script>const API='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-subscriptions-api',PROFILE='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-device-profile',STORE_PROFILE='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-store-profile',STORE_PAGE='https://raw.githack.com/moha700m/modx-signer-ci/minichat-fast-install/web/store.html';const $=s=>document.querySelector(s),status=$('#status'),actions=$('#actions'),subinfo=$('#subinfo'),service=$('#service');let code=localStorage.getItem('minichat-sub-code')||'',session=new URLSearchParams(location.search).get('session')||localStorage.getItem('minichat-fast-session')||'';function msg(t,c=''){status.className='status '+c;status.textContent=t}function btn(label,fn,cls=''){actions.innerHTML=`<button id="mainbtn" class="btn ${cls}">${label}</button>`;$('#mainbtn').onclick=fn}function link(label,href,cls=''){actions.innerHTML=`<a class="btn ${cls}" href="${href}">${label}</a>`}async function post(action,data={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,...data})});const d=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(d.error||'تعذر إكمال العملية');e.code=d.code||'';throw e}return d}function fmt(d){return new Date(d).toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'})}function showSub(s){subinfo.innerHTML=`<div class="sub"><div><b>${s.name||'-'}</b><small>العميل</small></div><div><b>${fmt(s.expiresAt)}</b><small>ينتهي</small></div><div><b>${s.activeDevices}/${s.maxDevices}</b><small>الأجهزة</small></div></div>`}function loginView(err=''){msg(err||'أدخل كود الاشتراك الذي استلمته.');actions.innerHTML='<input id="subcode" class="input" placeholder="MGZ-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters"><button id="login" class="btn" style="margin-top:10px">دخول</button>';$('#login').onclick=async()=>{const v=$('#subcode').value.trim().toUpperCase();if(!v)return;try{const s=await post('customer.verify',{code:v});code=v;localStorage.setItem('minichat-sub-code',v);showSub(s);session='';localStorage.removeItem('minichat-fast-session');render()}catch(e){msg(e.message,'bad')}}}async function start(){try{const s=await post('customer.session.create',{code});session=s.id;localStorage.setItem('minichat-fast-session',session);location.href=`${PROFILE}/profile?id=${encodeURIComponent(session)}`}catch(e){msg(e.message,'bad')}}function storeStep(name=''){msg(`تم تسجيل هذا الآيفون${name?' — '+name:''}. الآن ثبّت MGZ Store على الشاشة الرئيسية.`,'ok');link('تثبيت MGZ Store',`${STORE_PROFILE}/profile?session=${encodeURIComponent(session)}`);actions.insertAdjacentHTML('beforeend',`<a class="btn secondary" href="${STORE_PAGE}?session=${encodeURIComponent(session)}">فتح MGZ Store</a>`)}async function render(){service.textContent='جاهز';if(!code)return loginView();let sub;try{sub=await post('customer.verify',{code});showSub(sub)}catch(e){code='';localStorage.removeItem('minichat-sub-code');return loginView(e.message)}if(!session){msg('اشتراكك فعال. سجّل هذا الآيفون للمتابعة.','ok');btn('تسجيل هذا الآيفون',start);return}try{const s=await post('customer.session.get',{code,id:session});showSub(s.subscription);if(s.status==='pending'){msg('ثبّت ملف تسجيل الجهاز من الإعدادات، ثم ارجع لهذه الصفحة.');btn('تنزيل ملف تسجيل الجهاز مرة أخرى',()=>location.href=`${PROFILE}/profile?id=${encodeURIComponent(session)}`)}else if(['device_ready','device_processing','signing','ready','failed'].includes(s.status)){localStorage.setItem('mgz-store-session',session);storeStep(s.device_name||'')}else{storeStep(s.device_name||'')}}catch(e){localStorage.removeItem('minichat-fast-session');session='';msg(e.message,'bad');btn('بدء جلسة جديدة',start,'secondary')}}render();</script></body></html>
