<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070a11"><title>لوحة Minichat</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:#fff;background:#070a11}*{box-sizing:border-box}body{margin:0;background:#070a11;min-height:100vh}main{width:min(1180px,100%);margin:auto;padding:18px}.panel,.card,.stat{background:#0f141e;border:1px solid #263047;border-radius:20px}.panel{padding:18px;margin-bottom:15px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:25px}.muted{color:#8994a7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}.stat{padding:15px}.stat b{display:block;font-size:27px}.stat small{color:#8791a2}.grid{display:grid;grid-template-columns:1fr 1.7fr;gap:15px}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:12px;color:#aab4c4}.input,textarea,select{width:100%;padding:12px 13px;border:1px solid #2c3549;border-radius:13px;background:#090d14;color:#fff;font:inherit}.btn{border:0;border-radius:13px;padding:12px 14px;background:#596bf0;color:#fff;font:inherit;font-weight:850;cursor:pointer}.btn.small{padding:8px 10px;font-size:12px}.btn.secondary{background:#171e2a;border:1px solid #303b50}.btn.danger{background:#38161b;color:#ffb8c0;border:1px solid #672832}.btn.good{background:#12301f;color:#baf0cb;border:1px solid #28563b}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.customer{padding:15px;margin-bottom:10px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.badge{display:inline-block;border-radius:999px;padding:5px 8px;font-size:10px;background:#162018;color:#b9efca;border:1px solid #28563b}.badge.off{background:#2a1519;color:#ffc1c7;border-color:#57252d}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:9px 0}.chip{font-size:11px;padding:6px 8px;border-radius:9px;background:#111823;color:#aeb8c9}.devices{margin-top:11px;border-top:1px solid #222b3c;padding-top:10px}.device{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0}.device code{font-size:10px;color:#8e99aa;direction:ltr}.empty{padding:32px;text-align:center;color:#798497}.login{max-width:480px;margin:14vh auto}.notice{padding:12px;border-radius:13px;margin:10px 0;background:#0d121b;border:1px solid #283248;color:#aab5c7}.notice.bad{background:#281216;border-color:#5d252d;color:#ffc1c7}.codebox{direction:ltr;text-align:center;font-size:17px;letter-spacing:.04em;padding:14px;border:1px dashed #4b5a7b;border-radius:13px;background:#090d14;margin:12px 0;word-break:break-all}.hidden{display:none!important}@media(max-width:780px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.head,.device{align-items:flex-start;flex-direction:column}}</style></head><body><main><section id="login" class="login panel"><h1>لوحة اشتراكات Minichat</h1><p class="muted">أدخل مفتاح الإدارة.</p><input id="adminToken" class="input" type="password" placeholder="MGZ-ADMIN-..." autocomplete="off"><button id="loginBtn" class="btn" style="width:100%;margin-top:10px">دخول</button><div id="loginMsg" class="notice hidden"></div></section><div id="app" class="hidden"><div class="top"><div><h1>اشتراكات Minichat</h1><div class="muted">الاشتراك الافتراضي سنة كاملة لكل عميل</div></div><button id="logout" class="btn secondary">خروج</button></div><div class="stats"><div class="stat"><b id="sCustomers">0</b><small>كل العملاء</small></div><div class="stat"><b id="sActive">0</b><small>نشط</small></div><div class="stat"><b id="sDevices">0</b><small>أجهزة فعالة</small></div><div class="stat"><b id="sSigned">0</b><small>تم توقيعها</small></div></div><div class="grid"><section class="panel"><h2 style="margin-top:0">إضافة عميل</h2><div class="field"><label>اسم العميل</label><input id="name" class="input" placeholder="مثال: أحمد"></div><div class="field"><label>رقم الجوال</label><input id="phone" class="input" placeholder="05xxxxxxxx"></div><div class="field"><label>عدد الأجهزة</label><select id="maxDevices"><option value="1" selected>جهاز واحد</option><option value="2">جهازان</option><option value="3">3 أجهزة</option><option value="5">5 أجهزة</option></select></div><div class="field"><label>ملاحظة</label><textarea id="note" rows="3"></textarea></div><div class="notice">مدة الاشتراك: <b>365 يوم</b></div><button id="create" class="btn" style="width:100%">إنشاء اشتراك سنة</button><div id="createMsg" class="notice hidden"></div></section><section><div class="panel toolbar"><input id="search" class="input" style="flex:1;min-width:180px" placeholder="بحث بالاسم أو الجوال"><button id="refresh" class="btn secondary">تحديث</button></div><div id="customers"></div></section></div></div></main><script>const API='https://gbvopmtmzosqknntaafl.supabase.co/functions/v1/minichat-subscriptions-api';const $=s=>document.querySelector(s);let token=sessionStorage.getItem('minichat-admin-token')||'',all=[];async function post(action,data={}){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json','x-admin-token':token},body:JSON.stringify({action,...data})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'فشل الطلب');return d}function notice(el,text,bad=false){el.textContent=text;el.className='notice'+(bad?' bad':'')}function fmt(x){return x?new Date(x).toLocaleDateString('ar-SA',{year:'numeric',month:'short',day:'numeric'}):'-'}function st(c){return c.status==='active'?'نشط':c.status==='expired'?'منتهي':'موقوف'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function enter(){try{await post('admin.stats');sessionStorage.setItem('minichat-admin-token',token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(e){notice($('#loginMsg'),e.message,true)}}$('#loginBtn').onclick=()=>{token=$('#adminToken').value.trim();enter()};$('#logout').onclick=()=>{sessionStorage.removeItem('minichat-admin-token');location.reload()};async function load(){const [s,l]=await Promise.all([post('admin.stats'),post('admin.customers.list')]);$('#sCustomers').textContent=s.customers;$('#sActive').textContent=s.active;$('#sDevices').textContent=s.devices;$('#sSigned').textContent=s.signedDevices;all=l.customers||[];render()}function render(){const q=$('#search').value.trim().toLowerCase(),list=all.filter(c=>!q||(`${c.name} ${c.phone||''}`).toLowerCase().includes(q));if(!list.length){$('#customers').innerHTML='<div class="panel empty">لا يوجد عملاء.</div>';return}$('#customers').innerHTML=list.map(c=>`<div class="card customer"><div class="head"><div><strong>${esc(c.name)}</strong><div class="muted">${esc(c.phone||'بدون جوال')}</div></div><span class="badge ${c.status==='active'?'':'off'}">${st(c)}</span></div><div class="meta"><span class="chip">سنوي</span><span class="chip">ينتهي ${fmt(c.expiresAt)}</span><span class="chip">${c.activeDevices}/${c.maxDevices} أجهزة</span></div><div class="toolbar"><button class="btn small good" onclick="extendYear('${c.id}')">+ سنة</button><button class="btn small secondary" onclick="changeSeats('${c.id}',${c.maxDevices})">عدد الأجهزة</button><button class="btn small secondary" onclick="rotate('${c.id}')">كود جديد</button><button class="btn small ${c.status==='active'?'danger':'good'}" onclick="toggleCustomer('${c.id}','${c.status}')">${c.status==='active'?'إيقاف':'تفعيل'}</button></div><div class="devices">${(c.devices||[]).length?(c.devices||[]).map(d=>`<div class="device"><div><b>${esc(d.deviceName||'iPhone')}</b><br><code>${esc(d.udid)}</code></div><div class="toolbar"><button class="btn small ${d.status==='active'?'danger':'good'}" onclick="deviceStatus('${d.id}','${d.status==='active'?'revoked':'active'}')">${d.status==='active'?'إيقاف':'تفعيل'}</button><button class="btn small secondary" onclick="deviceDelete('${d.id}')">فك الجهاز</button></div></div>`).join(''):'<div class="muted">لا توجد أجهزة مرتبطة.</div>'}</div></div>`).join('')}$('#search').oninput=render;$('#refresh').onclick=load;$('#create').onclick=async()=>{try{const d=await post('admin.customer.create',{name:$('#name').value.trim(),phone:$('#phone').value.trim(),note:$('#note').value.trim(),planName:'سنوي',days:365,maxDevices:Number($('#maxDevices').value)});$('#createMsg').innerHTML=`تم إنشاء العميل.<div class="codebox">${esc(d.accessCode)}</div>انسخ الكود وأرسله للعميل. لن يظهر مرة أخرى بنفس الشكل.`;$('#createMsg').className='notice';$('#name').value='';$('#phone').value='';$('#note').value='';await load()}catch(e){notice($('#createMsg'),e.message,true)}};window.extendYear=async id=>{await post('admin.customer.update',{id,extendDays:365,planName:'سنوي'});await load()};window.changeSeats=async(id,current)=>{const n=Number(prompt('عدد الأجهزة المسموح بها (1-10):',current));if(!n)return;await post('admin.customer.update',{id,maxDevices:n});await load()};window.rotate=async id=>{if(!confirm('إصدار كود جديد؟ الكود القديم سيتوقف فورًا.'))return;const d=await post('admin.customer.rotate_code',{id});alert('الكود الجديد:\n'+d.accessCode);await load()};window.toggleCustomer=async(id,status)=>{await post('admin.customer.update',{id,status:status==='active'?'suspended':'active'});await load()};window.deviceStatus=async(id,status)=>{await post('admin.device.set_status',{id,status});await load()};window.deviceDelete=async id=>{if(!confirm('فك هذا الجهاز من الاشتراك؟'))return;await post('admin.device.delete',{id});await load()};if(token)enter();</script></body></html>
